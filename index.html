<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léo – Ton Prof</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; padding: 14px; text-align: center; font-size: 1.4rem; }
  #chat { flex: 1; padding: 16px; overflow-y: auto; }
  .leo { background: #1e293b; padding: 12px 16px; border-radius: 18px; max-width: 80%; margin-bottom: 12px; }
  #input-area { padding: 12px; background: #1e293b; display: flex; gap: 8px; }
  input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: white; }
  button { width: 48px; height: 48px; border-radius: 50%; background: #3b82f6; color: white; border: none; font-size: 20px; }
</style>
</head>
<body>
<header>Léo</header>
<div id="chat">
  <div class="leo">Salut ! Je suis Léo, ton professeur. Comment tu t’appelles et quel âge tu as ?</div>
</div>
<div id="input-area">
  <input id="message" placeholder="Écris à Léo...">
  <button onclick="send()">➤</button>
</div>

<script>
function send() {
  const input = document.getElementById('message');
  const text = input.value.trim();
  if (!text) return;
  const chat = document.getElementById('chat');
  chat.innerHTML += '<div style="text-align:right; margin:8px 0;"><span style="background:#3b82f6; color:white; padding:10px 14px; border-radius:18px; display:inline-block;">' + text + '</span></div>';
  input.value = '';
  chat.innerHTML += '<div class="leo">Je réfléchis...</div>';
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById('message').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
