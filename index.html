<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léo – Ton Prof</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; padding: 14px; text-align: center; font-size: 1.4rem; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.45; }
  .user { align-self: flex-end; background: #3b82f6; color: white; }
  .leo { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  #input-area { padding: 12px; background: #1e293b; display: flex; gap: 8px; }
  #message { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 20px; padding: 12px 16px; color: white; font-size: 16px; }
  button { background: #3b82f6; color: white; border: none; border-radius: 50%; width: 48px; height: 48px; font-size: 20px; }
</style>
</head>
<body>
<header>Léo</header>
<div id="chat"></div>
<div id="input-area">
  <input id="message" placeholder="Écris à Léo...">
  <button id="send">➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const messageInput = document.getElementById('message');
const sendBtn = document.getElementById('send');

function addMessage(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Message immédiat
addMessage('leo', 'Salut ! Je suis Léo, ton professeur. Comment tu t’appelles et quel âge tu as ?');

sendBtn.onclick = () => {
  const text = messageInput.value.trim();
  if (!text) return;
  addMessage('user', text);
  messageInput.value = '';
  addMessage('leo', 'Je réfléchis... (connexion au serveur en cours de test)');
};
</script>
</body>
</html>
