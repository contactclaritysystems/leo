<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Léo – Ton Prof</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1e293b;
    padding: 14px 16px;
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    border-bottom: 1px solid #334155;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.45;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: #3b82f6;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .leo {
    align-self: flex-start;
    background: #1e293b;
    border: 1px solid #334155;
    border-bottom-left-radius: 4px;
  }
  #input-area {
    padding: 12px;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #message {
    flex: 1;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 20px;
    padding: 12px 16px;
    color: white;
    font-size: 16px;
    resize: none;
    max-height: 120px;
  }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:disabled { opacity: 0.5; }
  #photo-btn { background: #475569; }
  #api-key-screen {
    position: fixed;
    inset: 0;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    z-index: 10;
  }
  #api-key-screen input {
    width: 100%;
    max-width: 400px;
    padding: 14px;
    margin: 16px 0;
    border-radius: 12px;
    border: 1px solid #475569;
    background: #1e293b;
    color: white;
    font-size: 16px;
  }
  #api-key-screen button {
    border-radius: 12px !important;
    width: auto !important;
    padding: 14px 32px !important;
    font-size: 16px !important;
  }
  .hidden { display: none !important; }
  img.preview {
    max-width: 200px;
    border-radius: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div id="api-key-screen">
  <h2>Bienvenue avec Léo</h2>
  <p style="margin-top:12px; text-align:center; max-width:400px; line-height:1.5;">
    Entre ta clé API OpenAI.<br>
    (Elle n’est pas sauvegardée, tu devras la remettre à chaque ouverture)
  </p>
  <input type="password" id="apiKeyInput" placeholder="sk-...">
  <button id="saveKey">Continuer</button>
</div>

<header>Léo</header>

<div id="chat"></div>

<div id="input-area">
  <button id="photo-btn" title="Envoyer une photo">📷</button>
  <textarea id="message" rows="1" placeholder="Écris à Léo..."></textarea>
  <button id="send">➤</button>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">

<script>
const BASE_PROMPT = `Tu t'appelles Léo. Tu es le professeur personnel des enfants de cette famille. Tu es patient, chaleureux, clair, encourageant et un peu joueur, mais tu restes avant tout un professeur.

Tu adaptes toujours ton langage, tes exemples et la difficulté à l'âge de l'enfant.

Règles pédagogiques importantes :
- Tu ne donnes jamais la réponse complète tout de suite. Tu guides l'enfant étape par étape.
- Tu poses des questions, tu proposes des indices, tu valorises la réflexion et les méthodes de l'enfant.
- Même quand il trouve la bonne réponse, tu lui demandes comment il a fait avant de valider complètement.
- Si l'enfant bloque, tu donnes un indice plus précis, puis tu le laisses réessayer.
- Tu restes positif, même quand il se trompe.
- Tu peux jouer ou faire des activités amusantes, mais tu reviens régulièrement vers quelque chose d'utile (calcul, lecture, observation, réflexion...).

Mémoire et connaissance de l'enfant :
- Au tout début d'une conversation avec un enfant que tu ne connais pas encore, demande gentiment son prénom et son âge.
- Ensuite, au fil des échanges, retiens ce qu'il aime, ce qu'il n'aime pas, ses points forts et ses difficultés.
- Utilise ces informations pour adapter tes exemples, tes activités et tes encouragements.
- Si tu as déjà des informations sur l'enfant (fournies dans le contexte), utilise-les naturellement.

Quand l'enfant envoie une photo (devoir, exercice, dessin, etc.) :
- Regarde attentivement.
- Identifie de quoi il s'agit.
- Commence par demander ce qu'il a déjà fait ou ce qui le bloque.
- Guide-le pas à pas.
- Valorise l'effort et les détails réussis.

Style :
- Phrases claires et adaptées à l'âge.
- Encourageants et sincères.
- Tu proposes souvent de continuer ensemble.

Sécurité :
- Toujours bienveillant et adapté aux enfants.
- Si l'enfant est fatigué ou frustré, propose une pause ou une activité plus légère.

Tu es Léo, leur professeur. Tu les aides à progresser avec plaisir et confiance.`;

let apiKey = localStorage.getItem('leo_api_key') || '';
let messages = [];
let currentImage = null;
let childProfile = JSON.parse(localStorage.getItem('leo_child_profile') || 'null');

const apiScreen = document.getElementById('api-key-screen');
const chat = document.getElementById('chat');
const messageInput = document.getElementById('message');
const sendBtn = document.getElementById('send');
const photoBtn = document.getElementById('photo-btn');
const fileInput = document.getElementById('fileInput');

function getSystemPrompt() {
  let prompt = BASE_PROMPT;
  if (childProfile && childProfile.name) {
    prompt += `\n\nInformations déjà connues sur l'enfant :\n- Prénom : ${childProfile.name}\n- Âge : ${childProfile.age || 'non précisé'}\n- Notes : ${childProfile.notes || 'aucune pour le moment'}`;
  }
  return prompt;
}

function initConversation() {
  messages = [{ role: 'system', content: getSystemPrompt() }];
  if (!childProfile || !childProfile.name) {
    addMessage('leo', 'Salut ! Je suis Léo, ton professeur. Comment tu t’appelles et quel âge tu as ?');
  } else {
    addMessage('leo', `Salut ${childProfile.name} ! Content de te revoir. Qu’est-ce qu’on fait aujourd’hui ?`);
  }
}

if (apiKey) {
  apiScreen.classList.add('hidden');
  initConversation();
}

document.getElementById('saveKey').addEventListener('click', () => {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key) {
    alert('Entre ta clé API');
    return;
  }
  if (!key.startsWith('sk-')) {
    alert('La clé doit commencer par sk-');
    return;
  }
  apiKey = key;
  localStorage.setItem('leo_api_key', apiKey);
  apiScreen.classList.add('hidden');
  initConversation();
});

function addMessage(who, text, imgSrc = null) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  if (imgSrc) {
    const img = document.createElement('img');
    img.src = imgSrc;
    img.className = 'preview';
    div.appendChild(img);
    div.appendChild(document.createElement('br'));
  }
  const span = document.createElement('span');
  span.innerHTML = text.replace(/\n/g, '<br>');
  div.appendChild(span);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function updateProfileFromConversation() {
  // Simple extraction attempt (basic)
  const lastUser = messages.filter(m => m.role === 'user').pop();
  if (!lastUser || !lastUser.content) return;
  const text = typeof lastUser.content === 'string' ? lastUser.content : '';
  if (!childProfile) childProfile = { name: '', age: '', notes: '' };
  // Very light parsing – the real memory will come from the model + manual notes later if needed
  localStorage.setItem('leo_child_profile', JSON.stringify(childProfile));
}

photoBtn.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    currentImage = reader.result;
    addMessage('user', '📷 Photo envoyée', currentImage);
    sendMessage();
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
};

sendBtn.onclick = () => sendMessage();
messageInput.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
};

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text && !currentImage) return;
  if (!apiKey) {
    alert('Clé API manquante');
    return;
  }

  if (text) addMessage('user', text);
  messageInput.value = '';
  messageInput.style.height = 'auto';

  const content = [];
  if (text) content.push({ type: 'text', text });
  if (currentImage) {
    content.push({
      type: 'image_url',
      image_url: { url: currentImage }
    });
  }

  messages.push({ role: 'user', content: content.length === 1 && content[0].type === 'text' ? text : content });
  currentImage = null;

  // Try to capture name/age if not known
  if (text && (!childProfile || !childProfile.name)) {
    const lower = text.toLowerCase();
    if (lower.includes('je m') || lower.includes("j'ai") || lower.includes('ans')) {
      // Let the model handle it, we just store later if needed
    }
  }

  sendBtn.disabled = true;
  addMessage('leo', '<em>Léo réfléchit...</em>');

  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: messages,
        max_tokens: 600,
        temperature: 0.7
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || 'Erreur API');
    }

    const data = await res.json();
    const reply = data.choices[0].message.content;

    chat.lastChild.remove();
    addMessage('leo', reply);

    messages.push({ role: 'assistant', content: reply });

    // Basic profile update (you can improve this later)
    if (!childProfile) childProfile = { name: '', age: '', notes: '' };
    localStorage.setItem('leo_child_profile', JSON.stringify(childProfile));

  } catch (err) {
    chat.lastChild.remove();
    addMessage('leo', 'Oups, j’ai eu un petit problème. (' + err.message + ')');
  }

  sendBtn.disabled = false;
}

messageInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
