<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léo – Ton Prof</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; padding: 14px; text-align: center; font-size: 1.4rem; }
  #chat { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.4; }
  .user { align-self: flex-end; background: #3b82f6; }
  .leo { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  #input-area { padding: 12px; background: #1e293b; display: flex; gap: 8px; }
  textarea { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #475569; background: #0f172a; color: white; resize: none; font-size: 16px; }
  button { width: 48px; height: 48px; border-radius: 50%; background: #3b82f6; color: white; border: none; font-size: 20px; }
</style>
</head>
<body>
<header>Léo</header>
<div id="chat">
  <div class="msg leo" id="welcome">Salut ! Je suis Léo. Comment tu t’appelles ?</div>
</div>
<div id="input-area">
  <textarea id="message" rows="1" placeholder="Écris à Léo..."></textarea>
  <button id="send">➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://kobqdisfhqiqesglvqky.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvYnFkaXNmaHFpcWVzZ2x2cWt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MTUwMzAsImV4cCI6MjEwODE5MTAzMH0.ZG_eKTztzEN581EQCbTNhtbR4YlMc-F11nInicAWdvg';
const FUNCTION_URL = 'https://kobqdisfhqiqesglvqky.supabase.co/functions/v1/hyper-action';

const chat = document.getElementById('chat');
const messageInput = document.getElementById('message');
const sendBtn = document.getElementById('send');
const welcome = document.getElementById('welcome');

const SYSTEM = `Tu es Léo, un professeur bienveillant pour enfants.
- Sois naturel et détendu. Ne pose pas trop de questions d'affilée.
- Guide l'enfant sans donner la réponse directement quand c'est un exercice.
- Adapte-toi à son âge et à ce qu'il dit.
- Réponds de façon concise.`;

let messages = [{ role: 'system', content: SYSTEM }];
let currentChild = null;
let supabase = null;

if (window.supabase) {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  supabase.from('children').select('*').order('created_at', { ascending: false }).limit(1).maybeSingle()
    .then(({ data }) => {
      if (data && data.name) {
        currentChild = data;
        welcome.textContent = `Salut ${data.name} !`;
        messages[0].content += ` L'enfant s'appelle ${data.name}${data.age ? ' et a ' + data.age + ' ans' : ''}.`;
      }
    });
}

function addMessage(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function saveChild(name, age) {
  if (!supabase || currentChild) return;
  const { data } = await supabase.from('children').insert({ name, age: age || null }).select().single();
  if (data) currentChild = data;
}

async function saveMsg(role, content) {
  if (!supabase || !currentChild) return;
  await supabase.from('messages').insert({ child_id: currentChild.id, role, content });
}

function sendMessage() {
  const text = messageInput.value.trim();
  if (!text) return;
  addMessage('user', text);
  messageInput.value = '';
  messages.push({ role: 'user', content: text });
  saveMsg('user', text);

  // Détection simple du prénom/âge
  if (!currentChild) {
    const m = text.match(/([A-Za-zÀ-ÿ]+)/);
    const ageMatch = text.match(/(\d+)\s*ans/);
    if (m) saveChild(m[1], ageMatch ? parseInt(ageMatch[1]) : null);
  }

  addMessage('leo', '...');
  fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
    body: JSON.stringify({ messages })
  })
  .then(r => r.json())
  .then(data => {
    chat.lastChild.remove();
    const reply = data.choices?.[0]?.message?.content || 'Ok.';
    addMessage('leo', reply);
    messages.push({ role: 'assistant', content: reply });
    saveMsg('assistant', reply);
  })
  .catch(() => {
    chat.lastChild.remove();
    addMessage('leo', 'Petit problème, réessaie.');
  });
}

sendBtn.onclick = sendMessage;
messageInput.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
</script>
</body>
</html>
